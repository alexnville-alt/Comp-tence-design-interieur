name: atelier

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atelier
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: atelier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Sans `-d atelier`, pg_isready teste la base par défaut « atelier »…
      # qui existe ici, mais l'expliciter évite une surprise si POSTGRES_DB
      # change un jour.
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage objet compatible S3, utilisé à partir de M6 (ADR-0008).
  # Présent dès maintenant pour que `docker compose up` donne un environnement
  # complet et que la configuration ne soit pas à découvrir plus tard.
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
