name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Une nouvelle poussée annule la CI précédente de la même branche : inutile
  # de payer une exécution complète pour un commit déjà remplacé.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices : la CI ne doit jamais avoir besoin de secrets de
  # production. La base est un service éphémère, les appels IA sont simulés
  # par l'adaptateur factice (ADR-0005, ADR-0011).
  DATABASE_URL: postgresql://atelier:atelier@localhost:5432/atelier?schema=public
  AUTH_SECRET: ci-secret-quinze-caracteres-et-plus-pour-passer-la-validation
  APP_URL: http://127.0.0.1:3100
  MAIL_TRANSPORT: console
  AI_PROVIDER: fake
  # Le job e2e démarre un vrai service MinIO sur ce port (voir plus bas) ;
  # le job qualite n'ouvre jamais de connexion S3 réelle (tests unitaires
  # uniquement), ces valeurs n'ont donc besoin d'être valides que pour
  # satisfaire la validation Zod au chargement du module (lib/env.ts).
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: auto
  S3_BUCKET: atelier
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin

jobs:
  qualite:
    name: Lint · types · tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

  e2e:
    name: Build · E2E · accessibilité
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector (M7, ADR-0013) — voir docker/compose.yml pour le détail.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atelier
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # `minio/minio` (utilisé par docker/compose.yml en local) exige un
      # argument de commande (`server /data`) que les conteneurs de service
      # GitHub Actions ne permettent pas de passer. `bitnami/minio` lance le
      # serveur avec sa commande par défaut et crée le bucket via
      # MINIO_DEFAULT_BUCKETS — équivalent fonctionnel pour la CI uniquement,
      # le développement local continue d'utiliser l'image officielle.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: atelier
          # ADR-0008 : dépôt direct navigateur → bucket (URL présignée) — sans
          # CORS, le préflight du navigateur bloque la requête avant qu'elle
          # n'atteigne MinIO. Origine de l'app pendant les E2E (APP_URL ci-dessus).
          MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:3100"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Migrations
        run: pnpm --filter @atelier/db migrate:deploy

      - name: Synchronisation du contenu
        run: pnpm --filter @atelier/web content:sync

      - name: Build
        run: pnpm build

      - name: Navigateur Playwright
        run: pnpm --filter @atelier/web exec playwright install --with-deps chromium

      - name: Tests E2E et audit d'accessibilité
        run: pnpm e2e

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Vérifie que l'image se construit sans secret : c'est la garantie que
  # `next build` ne dépend pas de la configuration de production (lib/env.ts).
  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
