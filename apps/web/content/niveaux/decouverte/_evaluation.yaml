title: "Évaluation — Découverte"
passingScore: 70
exercises:
  - slug: eval-decouverte-criteres
    type: QUIZ_MCQ
    prompt: "Lequel de ces critères doit toujours être validé en premier dans un espace ?"
    explanation: "La fonction se valide en premier : c'est la plus coûteuse à corriger après coup."
    choices:
      - "L'identité"
      - "La cohérence"
      - "La fonction"
      - "Le confort"
    correctIndices: [2]

  - slug: eval-decouverte-point-focal
    type: QUIZ_TRUE_FALSE
    prompt: "Vrai ou faux : une pièce peut avoir plusieurs points focaux sans que cela pose problème."
    explanation: "Un point focal qui en concurrence un autre casse la lecture de la pièce — l'erreur 7 du catalogue le rappelle."
    statement: "Une pièce peut avoir plusieurs points focaux sans que cela pose problème."
    correct: false

  - slug: eval-decouverte-vocabulaire
    type: QUIZ_MATCH
    prompt: "Associez chaque terme de vocabulaire à sa définition."
    explanation: "Voir la leçon « Le vocabulaire de base »."
    pairs:
      - left: "Zone"
        right: "Une portion de la pièce dédiée à un usage précis"
      - left: "Palette"
        right: "L'ensemble cohérent des couleurs et matières utilisées"
      - left: "Circulation"
        right: "Les trajets empruntés pour se déplacer"

  - slug: eval-decouverte-grille-lecture
    type: QUIZ_ORDER
    prompt: "Remettez les cinq questions de la grille de lecture dans leur ordre."
    explanation: "Usage, point focal, circulation, palette, puis usage réel des objets — l'usage se juge toujours avant le visuel."
    items:
      - "À quoi sert cette pièce, précisément ?"
      - "Où va le regard en premier ?"
      - "Comment circule-t-on ?"
      - "Combien de matières et de couleurs dominantes ?"
      - "Qu'est-ce qui est réellement utilisé, et qu'est-ce qui est décoratif ?"

  - slug: eval-decouverte-hotspot
    type: HOTSPOT
    prompt: "Cliquez sur l'élément qui joue le rôle de point focal dans ce salon."
    explanation: "La cheminée capte le regard en premier — c'est elle le point focal, pas le canapé ni le tapis."
    imageLabel: "Schéma d'un salon avec canapé, cheminée et tapis"
    zones:
      - x: 20
        y: 70
        radius: 12
        label: "Canapé"
        correct: false
      - x: 55
        y: 25
        radius: 10
        label: "Cheminée"
        correct: true
      - x: 35
        y: 85
        radius: 10
        label: "Tapis"
        correct: false

  - slug: eval-decouverte-referentiel
    type: QUIZ_MCQ
    prompt: "Sur 12 photos de séjours que vous aimez, un même ton de bois clair revient sur 9 d'entre elles. Que représente-t-il dans votre référentiel de goût ?"
    explanation: "Une constante — un élément qui revient dans la majorité des exemples aimés, jamais un jugement porté sur une seule photo isolée."
    choices:
      - "Une exception à ignorer"
      - "Une constante de votre référentiel"
      - "Une contrainte budgétaire"
      - "Le style unique à adopter partout"
    correctIndices: [1]

  - slug: eval-decouverte-mesures
    type: QUIZ_TRUE_FALSE
    prompt: "Vrai ou faux : la hauteur sous plafond maximale d'une pièce suffit pour vérifier qu'un meuble haut y passera partout."
    explanation: "Faux : une poutre, une pente de toit ou un faux plafond peuvent réduire la hauteur libre réelle à certains endroits — c'est cette hauteur réduite qui compte, pas la hauteur maximale de la pièce."
    statement: "La hauteur sous plafond maximale d'une pièce suffit pour vérifier qu'un meuble haut y passera partout."
    correct: false

  - slug: eval-decouverte-cas-salon-nord
    type: OPEN_CASE
    prompt: "Appliquez la grille de lecture en 5 questions à ce salon, et justifiez votre lecture."
    scenario: >-
      Un salon de 18 m², orienté plein nord, avec une seule fenêtre en façade.
      Le canapé fait face à un mur vide ; la cheminée, murée, ne sert plus
      qu'à poser des objets. Une bibliothèque encombrée occupe l'angle
      opposé à la fenêtre.
    constraint: >-
      Identifiez le point focal actuel de la pièce et proposez, en une
      phrase justifiée, s'il faut le conserver ou le déplacer.
    gradingNotes: >-
      Une bonne réponse identifie que la cheminée murée n'est plus un point
      focal fonctionnel (elle ne capte plus l'usage réel de la pièce) et
      propose soit de la restaurer comme point focal assumé, soit de créer
      un nouveau point focal côté fenêtre pour compenser l'orientation nord
      (lumière naturelle rare, à valoriser). Une réponse qui garde la
      cheminée murée comme point focal sans le justifier manque le critère
      « réponse à la contrainte ». Le vocabulaire attendu : point focal,
      orientation, lecture de l'espace (leçons 1 à 3 du niveau Découverte).
